name: Setup PHP and install dependencies
description: Installs PHP 8.4, restores the Composer cache and installs packages

runs:
  using: composite
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: "8.4"
        extensions: mbstring, intl, bcmath, zip, gd, pdo_sqlite, sockets, pcntl
        coverage: none
        tools: composer:v2

    - name: Composer cache directory
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache Composer packages
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: composer-${{ hashFiles('composer.lock') }}
        restore-keys: composer-

    - name: Install PHP dependencies
      shell: bash
      run: composer install --no-interaction --prefer-dist --no-progress