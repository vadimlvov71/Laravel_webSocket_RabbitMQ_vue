
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    # вложение не больше 5 MB (CommentAttachment) + поля формы
    client_max_body_size 8M;
 
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
 
    # загруженные пользователями файлы: только статика, тип не угадывать
    # (иначе .txt с HTML-разметкой браузер мог бы показать как страницу).
    # ^~ — чтобы regex-локация \.php$ ниже не перехватила /storage/*.php.
    # CSP sandbox: даже если браузер откроет файл как документ, скрипты не выполнятся.
    location ^~ /storage/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }
 
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
